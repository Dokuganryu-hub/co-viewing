<!DOCTYPE html>
<html>
    <head>
        <!-- <base href="home/"> -->
        <meta charset="utf-8">
        <title>Team Investigation</title>
        <link rel="stylesheet" href="./style.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500&amp;display=swap">
    </head>
    <body>

        <h1>Team Investigation</h1>
        <div class="player">
            <p>Cam footage:</p>
            <video id="video" src="./test.mp4" controls preload="auto"></video>
            <button id="videoBtn" class="videoBtn">Play</button>
        </div>

        <div class="sidebar"><p>placeholder</p></div>

        <script>

            const video = document.getElementById('video');
            const button = document.getElementById('videoBtn');
            function changeVideoStatus() {
                if (video.paused === false) {   
                    video.pause();
                } else {
                    video.play();
                }
            }

            function updateButtonText() {
                if (video.paused === true) {
                    button.innerText = 'Play';
                } else {
                    button.innerText = 'Pause';
                }
            }

            document.getElementById('videoBtn').addEventListener('click', changeVideoStatus);
            video.addEventListener('play', updateButtonText);
            video.addEventListener('pause', updateButtonText);

        </script>
    </body>
</html>
